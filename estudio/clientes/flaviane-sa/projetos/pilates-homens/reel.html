<script>
(function () {

  var box = document.getElementById('frase');

  var ERETO   = {shin: 1,  thigh: -1,  lum: -7, tor: 7, neck: 4,  head: -2, ua: 4,  fa: 12};
  var L = {shin: 262, thigh: 282, lum: 140, tor: 205, neck: 66};
  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function easeOut(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
  function add(p, len, ang) { return [p[0] + len * Math.sin(ang * rad), p[1] - len * Math.cos(ang * rad)]; }
  function down(p, len, ang) { return [p[0] + len * Math.sin(ang * rad), p[1] + len * Math.cos(ang * rad)]; }
  function pose(k, resp) {
    var o = {}; for (var j in ERETO) o[j] = CURVADO[j] + (ERETO[j] - CURVADO[j]) * k;
    o.tor += resp; return o;

  function rig(ax, P) {

    var pts = [R.H, R.L1, R.T, R.C], out = [];

  function perfil(tab, s) {
    for (var i = 1; i < tab.length; i++) if (s <= tab[i][0]) {

    }

  var FRENTE = [[0, 86], [0.16, 98], [0.36, 92], [0.58, 108], [0.8, 92], [0.93, 60], [1, 34]];

    g.closePath(); g.fill();
    g.beginPath(); g.arc(p[0], p[1], r0, 0, 7); g.fill();
    g.beginPath(); g.arc(q[0], q[1], r1, 0, 7); g.fill();
  }
  function desenha(R, alpha) {

    grad.addColorStop(0, '#4A2A5E'); grad.addColorStop(0.55, '#33203F'); grad.addColorStop(1, '#2A1A35');
    g.save(); g.globalAlpha = alpha; g.fillStyle = grad;
    // sombra no chao
    g.save(); g.fillStyle = 'rgba(123,91,142,.18)'; g.beginPath(); g.ellipse(R.A[0] + 40, 1418, 150, 16, 0, 0, 7); g.fill(); g.restore();
    // tronco a partir da coluna

      var a = sp[Math.max(0, i - 1)], b = sp[Math.min(sp.length - 1, i + 1)];

    g.save(); g.translate(Hc[0], Hc[1]); g.rotate((P.head + P.neck * 0.35) * rad);
    g.beginPath(); g.ellipse(-6, -8, 66, 76, 0, 0, 7); g.fill();               // cranio
    g.beginPath(); g.moveTo(-30, 30); g.quadraticCurveTo(10, 86, 52, 66); g.lineTo(60, 44); g.lineTo(58, 18); g.lineTo(76, 0); g.lineTo(60, -14);
    g.quadraticCurveTo(58, -40, 40, -56); g.lineTo(-10, -20); g.closePath(); g.fill();   // rosto, nariz e queixo
    g.restore();
    g.restore();
    return {sp: sp, Hc: Hc};
  }
  function vertebras(sp, alpha) {
    g.save(); g.globalAlpha = alpha; g.fillStyle = '#C9B3D6';
    for (var i = 3; i < sp.length - 1; i += 3) { g.beginPath(); g.ellipse(sp[i][0], sp[i][1], 9, 6, 0, 0, 7); g.fill(); }
    g.restore();

    if (t < t0 || alpha <= 0) return;

    var ph = ((t - t0) % 1.3) / 1.3;
    g.strokeStyle = '#7B5B8E'; g.lineWidth = 4; g.globalAlpha = alpha * (1 - ph);
    g.beginPath(); g.arc(p[0], p[1], 14 + ph * 60, 0, 7); g.stroke();
    g.globalAlpha = alpha;
    var bump = extra ? 1 + 0.6 * Math.max(0, 1 - Math.abs(t - extra - 0.15) / 0.25) : 1;
    g.fillStyle = '#7B5B8E'; g.strokeStyle = '#F5F0F8'; g.lineWidth = 4;
    g.beginPath(); g.arc(p[0], p[1], 14 * bump, 0, 7); g.fill(); g.stroke();

    if (t < t0 || alpha <= 0) return;

  var R0 = rig(300, pose(0, 0)), sp0 = coluna(R0, 48);
  var pCerv = sp0[44], pLomb = sp0[9], pJoel = R0.K;
  document.getElementById('r-cerv').style.top = (pCerv[1] - 64) + 'px';
  document.getElementById('r-lombar').style.top = (pLomb[1] - 64) + 'px';
  document.getElementById('r-joelho').style.top = (pJoel[1] - 64) + 'px';

  var s1 = document.getElementById('s1'), s4 = document.getElementById('s4');

    var pisca = n >= letras.length && Math.floor(t / 0.5) % 2;
    letras.forEach(function (sp, i) {

    document.getElementById('anel').style.visibility = t >= 21.4 ? 'visible' : 'hidden';
    // corpo
    g.clearRect(0, 0, 1080, 1920);

    indicador(R.K, 8.0, t, fade, 11.25); guia(R.K, parseFloat(document.getElementById('r-joelho').style.top) + 64, 8.0, t, fade);
    indicador(sp[9], 9.6, t, fade, 11.3); guia(sp[9], parseFloat(document.getElementById('r-lombar').style.top) + 64, 9.6, t, fade);
    // varredura clinica (transicao 2)

})();
