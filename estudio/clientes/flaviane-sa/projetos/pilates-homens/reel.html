<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pilates também é pra você</title>
<style>
  :root{--bg:#F5F0F8;--fg:#2A1A35;--acc:#7B5B8E;--dark:#3D2050;--claro:#F5F0F8;--lilas:#C9B3D6;--tinta:#A88BB9;
        --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  .camada{position:absolute;inset:0;overflow:hidden}
  em.k{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:0}

  /* CENA 1 */
  #s1{background:var(--dark);display:flex;align-items:center;justify-content:center}
  #frase{font-family:var(--sans);font-weight:800;color:var(--claro);font-size:100px;line-height:1.1;text-align:center;width:940px;
         text-transform:uppercase;letter-spacing:.01em}
  #frase em.k{color:var(--lilas);font-size:1.22em;text-transform:none}

  /* CENAS 2 e 3 */
  #s23{background:var(--bg)}
  canvas#corpo{position:absolute;inset:0;width:1080px;height:1920px}
  .rot{position:absolute;left:620px;font-family:var(--sans);font-weight:700;color:var(--fg);font-size:54px;line-height:1.05;white-space:nowrap}
  .rot em.k{font-size:1.22em;color:var(--acc)}
  .rot small{display:block;font-weight:600;font-size:21px;letter-spacing:.32em;color:var(--acc);margin-bottom:10px;text-transform:uppercase}
  @keyframes pop{0%{opacity:0;transform:translateX(40px) scale(1.15)}60%{opacity:1;transform:translateX(0) scale(.97)}100%{opacity:1;transform:none}}
  @keyframes some{to{opacity:0;filter:blur(8px)}}
  #s3txt{animation:some .45s ease 21.3s forwards;position:absolute;left:70px;right:70px;top:1470px;text-align:center;font-family:var(--serif);color:var(--fg)}
  #s3txt .l1{font-size:84px;font-weight:600;line-height:1.05;animation:fade 1s ease 16.2s both}
  #s3txt .l1 em.k{color:var(--acc);font-size:1.08em}
  #s3txt .l2{font-family:var(--sans);font-size:36px;font-weight:500;line-height:1.5;margin-top:28px;animation:fade 1.1s ease 17.7s both}
  #s3txt .l2 em.k{font-size:1.3em;color:var(--acc)}
  @keyframes fade{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

  /* CENA 4 */
  #s4{background:var(--dark)}
  @keyframes iris{from{clip-path:circle(0% at 50% 30%)}to{clip-path:circle(150% at 50% 30%)}}
  #anel{position:absolute;left:540px;top:576px;width:0;height:0;border:3px solid var(--acc);border-radius:50%;opacity:0;
        animation:anel 1.1s cubic-bezier(.7,0,.2,1) 21.5s both}
  @keyframes anel{0%{width:0;height:0;margin:0;opacity:0}6%{opacity:1}100%{width:3200px;height:3200px;margin:-1600px 0 0 -1600px;opacity:0}}
  #s4 .bloco{position:absolute;top:360px;left:60px;right:60px;text-align:center;font-family:var(--sans);font-weight:800;color:var(--claro);
             font-size:92px;line-height:1.14;animation:respira 2s ease-in-out 24s infinite}
  #s4 .bloco em.k{color:var(--lilas);font-size:1.25em}
  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  #s4 .bloco span{display:block;animation:pop4 .7s cubic-bezier(.2,.7,.1,1) both}
  @keyframes pop4{0%{opacity:0;transform:translateY(40px) scale(1.08);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
  #s4 .assina{position:absolute;top:1060px;left:0;right:0;text-align:center;animation:desliza 1s cubic-bezier(.2,.7,.1,1) 24.6s both}
  @keyframes desliza{from{opacity:0;transform:translateY(130px)}to{opacity:1;transform:none}}
  #s4 .nome{font-family:var(--serif);font-style:italic;font-weight:600;font-size:100px;color:var(--claro)}
  #s4 .linha-a{width:0;height:1.6px;background:var(--tinta);margin:24px auto;animation:abre .9s ease 25.2s forwards}
  @keyframes abre{to{width:220px}}
  #s4 .sub{font-family:var(--sans);font-weight:600;font-size:30px;letter-spacing:.42em;color:var(--tinta);text-transform:uppercase;
           margin-left:.42em;animation:fade .9s ease 25.4s both}
  #s4 .cta{position:absolute;top:1470px;left:0;right:0;text-align:center;animation:popc .8s cubic-bezier(.2,.7,.1,1) 26.4s both}
  @keyframes popc{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  #s4 .cta b{display:inline-block;background:var(--acc);color:var(--claro);font-family:var(--sans);font-weight:700;font-size:52px;
             padding:30px 66px;border-radius:999px;animation:respira 1.6s ease-in-out 27.4s infinite;box-shadow:0 18px 50px rgba(0,0,0,.28)}
  #s4 .cta b em.k{font-size:1.28em;color:#fff}
  #s4 .brilho{position:absolute;top:1470px;left:-400px;width:260px;height:150px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
              animation:varre 1.4s ease-in-out 27.6s both;mix-blend-mode:screen}
  @keyframes varre{from{left:-400px}to{left:1300px}}

  /* TRANSICAO 1: paineis na cor da marca */
  .painel{position:absolute;inset:0;transform:translateY(100%);animation:painel .9s cubic-bezier(.7,0,.2,1) both}
  @keyframes painel{0%{transform:translateY(100%)}45%{transform:translateY(0)}55%{transform:translateY(0)}100%{transform:translateY(-100%)}}
</style>
</head>
<body>

<section class="camada" id="s23">
  <canvas id="c3d" width="1080" height="1920" style="position:absolute;inset:0;width:1080px;height:1920px"></canvas>
  <canvas id="corpo" width="1080" height="1920"></canvas>
  <div class="rot" id="r-cerv" style="animation:pop .6s cubic-bezier(.2,.7,.1,1) 6.5s both, some .45s ease 12.3s forwards"><small>cervical</small><em class="k">Dor</em> na cervical.</div>
  <div class="rot" id="r-joelho" style="animation:pop .6s cubic-bezier(.2,.7,.1,1) 8.1s both, some .45s ease 12.3s forwards"><small>joelho</small><em class="k">Artrose.</em></div>
  <div class="rot" id="r-lombar" style="animation:pop .6s cubic-bezier(.2,.7,.1,1) 9.7s both, some .45s ease 12.3s forwards"><small>lombar</small><em class="k">Dor</em> na lombar.</div>
  <div class="rot" id="r-forca" style="animation:pop .6s cubic-bezier(.2,.7,.1,1) 11.2s both, some .45s ease 12.3s forwards"><small>o corpo todo</small>Perda de <em class="k">força.</em></div>
  <div id="s3txt">
    <div class="l1">Aqui não é aula.<br>É <em class="k">tratamento.</em></div>
    <div class="l2"><em class="k">Avaliação.</em> Raciocínio <em class="k">clínico.</em><br>Exercício escolhido <em class="k">pra você.</em></div>
  </div>
</section>

<section class="camada" id="s1"><div id="frase"></div></section>

<div class="painel" style="background:#7B5B8E;animation-delay:4.7s"></div>
<div class="painel" style="background:#C9B3D6;animation-delay:4.76s"></div>
<div class="painel" style="background:#F5F0F8;animation-delay:4.82s"></div>

<div id="anel"></div>
<section class="camada" id="s4">
  <div class="bloco">
    <span style="animation-delay:22.5s">Se você é <em class="k">homem,</em></span>
    <span style="animation-delay:22.9s">saiba que <em class="k">pilates</em></span>
    <span style="animation-delay:23.3s"><em class="k">também é pra você.</em></span>
  </div>
  <div class="assina">
    <div class="nome">Dra. Flaviane Sá</div>
    <div class="linha-a"></div>
    <div class="sub">Fisioterapia e Pilates</div>
  </div>
  <div class="cta"><b>Agende sua <em class="k">avaliação</em></b></div>
  <div class="brilho"></div>
</section>

<script src="node_modules/three/build/three.min.js"></script><!-- npm i three@0.149.0 nesta pasta; copie humano.js e boneco3d.js de .claude/skills/estudio-criativo/modelos/humano3d -->
<script src="humano.js"></script>
<script src="boneco3d.js"></script>
<script>
(function () {
  // ---------- cena 1: digitacao com palavras-chave em italico ----------
  var partes = [['Se você é ', 0], ['homem', 1], [', precisa ', 0], ['saber\u00a0disso.', 1]];
  var box = document.getElementById('frase');
  var letras = [];
  partes.forEach(function (p) {
    var alvo = box;
    if (p[1]) { alvo = document.createElement('em'); alvo.className = 'k'; box.appendChild(alvo); }
    p[0].split('').forEach(function (c) {
      var sp = document.createElement('span'); sp.textContent = c; sp.style.visibility = 'hidden'; alvo.appendChild(sp); letras.push(sp);
    });
  });

  // ---------- boneco 3D ----------
  var c3d = document.getElementById('c3d');
  Boneco.init(c3d, {alvoY: -1.9, alturaVisivel: 33.7});
  var cv = document.getElementById('corpo'), g = cv.getContext('2d');
  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function easeOut(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
  var X2 = -3.9;
  Boneco.desenha({k: 0, x: X2, giro: -8});
  var p0 = {c: Boneco.projeta('neck02'), l: Boneco.projeta('spine04'), j: Boneco.projeta('lowerleg01.R')};
  document.getElementById('r-cerv').style.top = (p0.c[1] - 64) + 'px';
  document.getElementById('r-lombar').style.top = (p0.l[1] - 64) + 'px';
  document.getElementById('r-joelho').style.top = (p0.j[1] - 64) + 'px';
  document.getElementById('r-forca').style.top = Math.max(p0.j[1] + 110, 1230) + 'px';
  function indicador(p, t0, t, alpha, extra) {
    if (t < t0 || alpha <= 0) return;
    g.save();
    var ph = ((t - t0) % 1.3) / 1.3;
    g.strokeStyle = '#7B5B8E'; g.lineWidth = 4; g.globalAlpha = alpha * (1 - ph);
    g.beginPath(); g.arc(p[0], p[1], 14 + ph * 60, 0, 7); g.stroke();
    g.globalAlpha = alpha * 0.35; g.fillStyle = '#7B5B8E'; g.beginPath(); g.arc(p[0], p[1], 34, 0, 7); g.fill();
    g.globalAlpha = alpha;
    var bump = extra ? 1 + 0.6 * Math.max(0, 1 - Math.abs(t - extra - 0.15) / 0.25) : 1;
    g.fillStyle = '#7B5B8E'; g.strokeStyle = '#F5F0F8'; g.lineWidth = 4;
    g.beginPath(); g.arc(p[0], p[1], 14 * bump, 0, 7); g.fill(); g.stroke();
    g.restore();
  }
  function guia(p, y, t0, t, alpha) {
    if (t < t0 || alpha <= 0) return;
    var k = easeOut((t - t0) / 0.5), x1 = 600;
    g.save(); g.globalAlpha = alpha; g.strokeStyle = '#7B5B8E'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(p[0] + 18, p[1]); g.lineTo(p[0] + 18 + (x1 - p[0] - 18) * k, p[1] + (y - p[1]) * k); g.stroke();
    g.restore();
  }
  function topo(id) { return parseFloat(document.getElementById(id).style.top) + 64; }

  var s1 = document.getElementById('s1'), s4 = document.getElementById('s4');
  window.cena = function (t) {
    // cena 1
    s1.style.display = t < 5.15 ? 'flex' : 'none';
    var n = t < 0.4 ? 0 : Math.min(letras.length, Math.floor((t - 0.4) / 0.088) + 1);
    var pisca = n >= letras.length && Math.floor(t / 0.5) % 2;
    letras.forEach(function (sp, i) {
      sp.style.visibility = i < n ? 'visible' : 'hidden';
      sp.style.boxShadow = (i === n - 1 && !pisca) ? '8px 0 0 0 #F5F0F8' : 'none';
    });
    s4.style.visibility = t >= 22.55 ? 'visible' : 'hidden';
    document.getElementById('anel').style.display = 'none';
    // corpo 3D
    g.clearRect(0, 0, 1080, 1920);
    var vis = t >= 5.1 && t <= 22.7;
    c3d.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    var x = X2 - 17 * (1 - easeOut((t - 5.25) / 1.3)) + (-X2) * ease((t - 12.5) / 1.2);
    var k = ease((t - 13) / 3);
    Boneco.desenha({k: k, x: x, respira: 0.8 * Math.sin(t * 2.2), giro: -8 - 30 * ease((t - 17.2) / 5)});
    // linha de prumo
    var ap = Math.min(ease((t - 13.1) / 1.2), 1 - ease((t - 16.6) / 0.8));
    if (ap > 0) {
      var pe = Boneco.projeta('foot.R');
      g.save(); g.strokeStyle = '#7B5B8E'; g.globalAlpha = 0.8 * Math.min(1, (t - 13.1) * 4) * (1 - ease((t - 16.6) / 0.8)); g.lineWidth = 2.5; g.setLineDash([16, 12]);
      g.beginPath(); g.moveTo(pe[0] + 4, 200); g.lineTo(pe[0] + 4, 200 + 1250 * ease((t - 13.1) / 1.2)); g.stroke(); g.restore();
    }
    var fade = 1 - ease((t - 12.3) / 0.45);
    var pc = Boneco.projeta('neck02'), pl = Boneco.projeta('spine04'), pj = Boneco.projeta('lowerleg01.R');
    indicador(pc, 6.4, t, fade, 11.2); guia(pc, topo('r-cerv'), 6.4, t, fade);
    indicador(pj, 8.0, t, fade, 11.25); guia(pj, topo('r-joelho'), 8.0, t, fade);
    indicador(pl, 9.6, t, fade, 11.3); guia(pl, topo('r-lombar'), 9.6, t, fade);
    // iris para a cena final (desenhada por cima do boneco)
    var ir = (t - 21.6) / 0.95;
    if (ir > 0) {
      var e = ir < 1 ? (ir < .5 ? 4 * ir * ir * ir : 1 - Math.pow(-2 * ir + 2, 3) / 2) : 1;
      var raio = 2300 * e;
      g.save(); g.fillStyle = '#3D2050'; g.beginPath(); g.arc(540, 576, raio, 0, 7); g.fill();
      g.strokeStyle = '#A88BB9'; g.lineWidth = 3; g.globalAlpha = Math.max(0, 1 - ir);
      g.beginPath(); g.arc(540, 576, raio * 1.08 + 20, 0, 7); g.stroke(); g.restore();
    }
    // varredura clinica
    var v = (t - 12.2) / 0.9;
    if (v > 0 && v < 1) {
      var y = 200 + 1300 * ease(v);
      var gr = g.createLinearGradient(0, y - 120, 0, y + 6);
      gr.addColorStop(0, 'rgba(201,179,214,0)'); gr.addColorStop(1, 'rgba(123,91,142,.45)');
      g.fillStyle = gr; g.fillRect(0, y - 120, 1080, 126);
      g.fillStyle = '#7B5B8E'; g.fillRect(0, y, 1080, 3);
    }
  };
  window.cena(0);
})();
</script>
</body>
</html>
