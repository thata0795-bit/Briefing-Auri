<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Natal Luana Personal Chef</title>
<style>
  :root{
    --choc:#6B3F24; --off:#F5F1EA; --ouro:#C7A46A; --terra:#A66542; --marsala:#7A3E48; --cafe:#3B2416;
    --areia:#DDD0C0; --caramelo:#B7835A; --rosa:#C48A85; --luz:#E9C48A;
    --serif:'Cormorant Garamond', Georgia, serif; --caps:'Cinzel', Georgia, serif; --sans:'Montserrat', Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cafe)}
  .cena{position:absolute;inset:0;display:none;overflow:hidden}
  .cena.ativa{display:block}
  canvas.part{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;mix-blend-mode:screen}
  .moldura{position:absolute;inset:44px;pointer-events:none}
  .moldura rect{fill:none;stroke:var(--ouro);stroke-width:1.6;stroke-dasharray:5800;stroke-dashoffset:5800;
                animation:desenha 2.2s cubic-bezier(.6,0,.2,1) .2s forwards;opacity:.75}
  @keyframes desenha{to{stroke-dashoffset:0}}
  .rotulo{font-family:var(--caps);font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--ouro);
          text-align:center;font-size:30px}
  .ouro-texto{background:linear-gradient(100deg,#9C7A3E 0%,#E9C48A 30%,#FFF1CF 45%,#C7A46A 60%,#8E6B32 100%);
              background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
              animation:brilho 3.2s ease-in-out .6s both}
  .sobe>span.ouro-texto{animation:sobe 1.1s cubic-bezier(.2,.7,.1,1) both, brilho 3.2s ease-in-out both}
  @keyframes brilho{from{background-position:100% 0}to{background-position:0% 0}}
  .linha{display:flex;align-items:center;justify-content:center;gap:22px;color:var(--ouro)}
  .linha i{display:block;height:1.4px;width:0;background:var(--ouro);animation:abre 1.4s cubic-bezier(.6,0,.2,1) both}
  @keyframes abre{to{width:190px}}
  .estrela{width:34px;height:34px;animation:gira 1.6s cubic-bezier(.3,0,.2,1) both}
  @keyframes gira{from{transform:rotate(-90deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
  .sobe{overflow:hidden;display:block}
  .sobe>span{display:block;animation:sobe 1.1s cubic-bezier(.2,.7,.1,1) both}
  @keyframes sobe{from{transform:translateY(110%)}to{transform:translateY(0)}}
  .foco{animation:foco 1.4s cubic-bezier(.2,.7,.1,1) both}
  @keyframes foco{from{filter:blur(18px);opacity:0;transform:scale(1.08)}to{filter:blur(0);opacity:1;transform:scale(1)}}
  .trilha{animation:trilha 3.6s cubic-bezier(.2,.7,.1,1) both}
  @keyframes trilha{from{letter-spacing:.9em;opacity:0}to{letter-spacing:.42em;opacity:1}}
  .surge{animation:surge 1s ease both}
  @keyframes surge{from{opacity:0}to{opacity:1}}

  /* 1 abertura */
  #c1{background:radial-gradient(ellipse at 50% 42%, #6B3F24 0%, #4A2C1A 38%, #3B2416 70%, #24150C 100%)}
  #c1 .feixe{position:absolute;top:-200px;left:-600px;width:500px;height:2400px;transform:rotate(22deg);
             background:linear-gradient(90deg,transparent,rgba(233,196,138,.20),transparent);animation:feixe 3.4s ease-in-out .3s both}
  @keyframes feixe{from{left:-700px}to{left:1300px}}
  #c1 .topo{position:absolute;top:300px;left:0;right:0}
  #c1 .logo{position:absolute;top:470px;left:50%;width:420px;margin-left:-210px;
            filter:drop-shadow(0 0 28px rgba(233,196,138,.35));animation:foco 1.8s cubic-bezier(.2,.7,.1,1) .25s both}
  #c1 .titulo{position:absolute;top:1010px;left:0;right:0;text-align:center;font-family:var(--serif);color:var(--off)}
  #c1 .titulo .l1{font-size:78px;font-weight:500;line-height:1.05}
  #c1 .titulo .l2{font-size:120px;font-style:italic;font-weight:500;line-height:1.02}
  #c1 .titulo .l3{font-family:var(--caps);font-size:40px;letter-spacing:.32em;margin-top:44px}

  /* 6 sobremesa */
  #c6{background:radial-gradient(ellipse at 50% 38%, #C48A85 0%, #9A5B5E 40%, #7A3E48 75%, #4E2530 100%)}
  #c6 .janela{position:absolute;top:300px;left:50%;width:880px;height:900px;margin-left:-440px;overflow:hidden;
              border-radius:440px 440px 40px 40px;box-shadow:0 40px 90px rgba(40,15,20,.5);
              animation:janela 1.5s cubic-bezier(.2,.7,.1,1) both}
  @keyframes janela{from{clip-path:inset(50% 50% 50% 50% round 40px);transform:scale(.92)}to{clip-path:inset(0 0 0 0 round 0);transform:none}}
  #c6 .janela img{position:absolute;height:1000px;width:auto;top:-50px;left:0;animation:panoramica 5.6s cubic-bezier(.45,0,.25,1) both}
  @keyframes panoramica{from{transform:translateX(-20px) scale(1.06)}to{transform:translateX(-440px) scale(1.0)}}
  #c6 .contorno{position:absolute;top:276px;left:50%;width:928px;height:948px;margin-left:-464px;border:1.6px solid var(--ouro);
                border-radius:464px 464px 52px 52px;animation:surge 1.2s ease .9s both}
  #c6 .texto{position:absolute;top:1330px;left:0;right:0;text-align:center}
  #c6 .rotulo{color:var(--off)}
  #c6 .grande{font-family:var(--serif);font-style:italic;color:var(--off);font-size:104px;line-height:1.04;margin-top:26px}
  #c6 .grande b{font-weight:600;font-style:normal}
  /* 3 assado */
  #c3{background:var(--off)}
  #c3 .fundo-terra{position:absolute;right:0;top:0;bottom:0;width:0;background:var(--terra);animation:faixa 1.1s cubic-bezier(.7,0,.2,1) both}
  @keyframes faixa{to{width:300px}}
  #c3 .arco{position:absolute;top:210px;right:110px;width:690px;height:1060px;border-radius:345px 345px 0 0;overflow:hidden;
            box-shadow:0 30px 70px rgba(59,36,22,.35);animation:arco 1.4s cubic-bezier(.2,.7,.1,1) .15s both}
  @keyframes arco{from{transform:translateY(160px);opacity:0;clip-path:inset(100% 0 0 0)}to{transform:none;opacity:1;clip-path:inset(0 0 0 0)}}
  #c3 .arco img{width:100%;height:100%;object-fit:cover;animation:kb 5.4s ease-out both}
  @keyframes kb{from{transform:scale(1.22) translateY(-30px)}to{transform:scale(1.04) translateY(0)}}
  #c3 .arco-linha{position:absolute;top:186px;right:86px;width:738px;height:1108px;border:1.6px solid var(--ouro);border-bottom:none;
                  border-radius:369px 369px 0 0;animation:surge 1.2s ease .9s both}
  #c3 .texto{position:absolute;left:96px;right:96px;top:1370px}
  #c3 .rotulo{text-align:left;color:var(--terra)}
  #c3 .grande{font-family:var(--serif);color:var(--cafe);font-size:150px;line-height:.95;font-weight:500;margin-top:24px}
  #c3 .grande em{font-style:italic;color:var(--marsala);font-size:92px;display:block;margin-top:10px}

  /* 4 tabua */
  #c4{background:var(--cafe)}
  #c4 .borrado{position:absolute;inset:-80px;background:url(assets/tabua.jpg) center/cover;filter:blur(40px) brightness(.45) saturate(1.1);
               animation:kb 5s ease-out both}
  #c4 .cartao{position:absolute;top:240px;left:50%;width:860px;height:1300px;margin-left:-430px;overflow:hidden;border-radius:6px;
              box-shadow:0 40px 100px rgba(0,0,0,.55);animation:cartao 1.5s cubic-bezier(.2,.7,.1,1) both}
  @keyframes cartao{from{transform:perspective(1600px) rotateX(18deg) translateY(220px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  #c4 .cartao img{width:100%;height:100%;object-fit:cover;animation:push 5s ease-out both}
  @keyframes push{from{transform:scale(1.02)}to{transform:scale(1.14)}}
  #c4 .cartao::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(36,21,12,.85) 100%)}
  #c4 .canto{position:absolute;width:90px;height:90px;border-color:var(--ouro);border-style:solid;animation:surge .8s ease 1s both}
  #c4 .texto{position:absolute;left:0;right:0;top:1290px;text-align:center;z-index:2}
  #c4 .grande{font-family:var(--serif);font-style:italic;color:var(--off);font-size:96px;line-height:1.04;margin-top:22px}

  /* 5 chamada */
  #c5{background:radial-gradient(ellipse at 50% 40%, #6B3F24 0%, #3B2416 62%, #1F120A 100%)}
  #c5 .selo{position:absolute;top:250px;left:0;right:0}
  #c5 .titulo{position:absolute;top:470px;left:0;right:0;text-align:center;font-family:var(--serif)}
  #c5 .titulo .a{font-size:150px;font-weight:600;line-height:.98}
  #c5 .titulo .b{font-size:150px;font-style:italic;font-weight:500;line-height:.98}
  #c5 .sub{position:absolute;top:910px;left:0;right:0;text-align:center;font-family:var(--serif);color:var(--off);font-size:60px;font-style:italic}
  #c5 .logo{position:absolute;top:1220px;left:50%;width:300px;margin-left:-150px;filter:drop-shadow(0 0 24px rgba(233,196,138,.35))}
  #c5 .assina{position:absolute;top:1520px;left:0;right:0}
  #c5 .valores{position:absolute;top:1640px;left:0;right:0;text-align:center;font-family:var(--caps);color:var(--areia);
               font-size:19px;letter-spacing:.2em;opacity:.8}
</style>
</head>
<body>

<!-- 1 -->
<section class="cena" id="c1">
  <div class="feixe"></div>
  <canvas class="part" width="1080" height="1920"></canvas>
  <svg class="moldura" viewBox="0 0 992 1832"><rect x="1" y="1" width="990" height="1830"/></svg>
  <div class="topo">
    <div class="rotulo trilha" style="animation-delay:.1s">Temporada de Natal</div>
    <div class="linha" style="margin-top:28px"><i style="animation-delay:.5s"></i>
      <svg class="estrela" viewBox="-10 -10 20 20" style="animation-delay:.6s"><path d="M0-10 1.6-1.6 10 0 1.6 1.6 0 10-1.6 1.6-10 0-1.6-1.6Z" fill="#C7A46A"/></svg>
      <i style="animation-delay:.5s"></i></div>
  </div>
  <img class="logo" src="assets/logo.png" alt="">
  <div class="titulo">
    <span class="sobe l1"><span style="animation-delay:1.0s">a temporada mais</span></span>
    <span class="sobe l2"><span class="ouro-texto" style="animation-delay:1.25s, 1.6s">esperada do ano</span></span>
    <div class="l3 rotulo foco" style="animation-delay:2.0s;color:var(--off)">está aberta</div>
  </div>
</section>

<!-- 3 -->
<section class="cena" id="c3">
  <div class="fundo-terra"></div>
  <div class="arco-linha"></div>
  <div class="arco"><img src="assets/assado.jpg" alt=""></div>
  <div class="texto">
    <div class="rotulo trilha" style="animation-delay:.6s">Para a ceia</div>
    <div class="grande"><span class="sobe"><span style="animation-delay:.8s">Assados</span></span>
      <span class="sobe"><span style="animation-delay:1.05s"><em>feitos com carinho</em></span></span></div>
  </div>
</section>

<!-- 4 -->
<section class="cena" id="c4">
  <div class="borrado"></div>
  <canvas class="part" width="1080" height="1920"></canvas>
  <div class="cartao"><img src="assets/tabua.jpg" alt=""></div>
  <div class="canto" style="top:210px;left:80px;border-width:2px 0 0 2px"></div>
  <div class="canto" style="top:210px;right:80px;border-width:2px 2px 0 0"></div>
  <div class="canto" style="top:1450px;left:80px;border-width:0 0 2px 2px"></div>
  <div class="canto" style="top:1450px;right:80px;border-width:0 2px 2px 0"></div>
  <div class="texto">
    <div class="rotulo trilha" style="animation-delay:.6s;color:var(--luz);text-shadow:0 2px 12px rgba(0,0,0,.6)">Tábuas</div>
    <div class="grande"><span class="sobe"><span style="animation-delay:.9s">para receber</span></span>
      <span class="sobe"><span style="animation-delay:1.1s">quem você ama</span></span></div>
  </div>
</section>

<!-- 6 -->
<section class="cena" id="c6">
  <canvas class="part" width="1080" height="1920"></canvas>
  <div class="contorno"></div>
  <div class="janela"><img src="assets/sobremesa.jpg" alt=""></div>
  <div class="texto">
    <div class="rotulo trilha" style="animation-delay:.5s">Sobremesas</div>
    <div class="grande"><span class="sobe"><span style="animation-delay:.85s">para adoçar</span></span>
      <span class="sobe"><span style="animation-delay:1.1s">a <b class="ouro-texto">noite de Natal</b></span></span></div>
  </div>
</section>

<!-- 5 -->
<section class="cena" id="c5">
  <canvas class="part" width="1080" height="1920"></canvas>
  <svg class="moldura" viewBox="0 0 992 1832"><rect x="1" y="1" width="990" height="1830"/></svg>
  <div class="selo">
    <div class="rotulo trilha" style="animation-delay:.1s">Natal 2026</div>
    <div class="linha" style="margin-top:28px"><i style="animation-delay:.4s"></i>
      <svg class="estrela" viewBox="-10 -10 20 20" style="animation-delay:.5s"><path d="M0-10 1.6-1.6 10 0 1.6 1.6 0 10-1.6 1.6-10 0-1.6-1.6Z" fill="#C7A46A"/></svg>
      <i style="animation-delay:.4s"></i></div>
  </div>
  <div class="titulo">
    <span class="sobe a"><span class="ouro-texto" style="animation-delay:.5s, .9s">Encomendas</span></span>
    <span class="sobe b"><span style="animation-delay:.75s;color:var(--off)">abertas</span></span>
  </div>
  <div class="sub foco" style="animation-delay:1.5s">garanta a sua ceia</div>
  <img class="logo foco" src="assets/logo.png" alt="" style="animation-delay:2.3s">
  <div class="assina"><div class="rotulo trilha" style="animation-delay:2.5s;color:var(--off)">Luana Personal Chef</div></div>
  <div class="valores surge" style="animation-delay:3.4s">sofisticação · acolhimento · afeto em cada detalhe</div>
</section>

<script>
(function () {
  var id = (location.hash || '#c1').slice(1);
  var cena = document.getElementById(id);
  cena.classList.add('ativa');
  var cv = cena.querySelector('canvas.part');
  var densidade = { c1: 70, c4: 40, c5: 110, c6: 55 }[id] || 50;
  var ps = [];
  var s = 7;
  function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
  for (var i = 0; i < densidade; i++) {
    ps.push({ x: rnd() * 1080, y: rnd() * 1920, r: 1.5 + Math.pow(rnd(), 3) * 16, v: 18 + rnd() * 50,
              f: rnd() * 6.28, a: 0.25 + rnd() * 0.6, w: 0.4 + rnd() * 1.2 });
  }
  window.cena = function (t) {
    if (!cv) return;
    var g = cv.getContext('2d');
    g.clearRect(0, 0, 1080, 1920);
    g.globalCompositeOperation = 'lighter';
    ps.forEach(function (p) {
      var y = ((p.y - p.v * t) % 1960 + 1960) % 1960 - 20;
      var x = p.x + Math.sin(t * p.w + p.f) * 26;
      var tw = 0.55 + 0.45 * Math.sin(t * 2.2 * p.w + p.f * 3);
      var e = Math.min(1, t / 0.8);
      var gr = g.createRadialGradient(x, y, 0, x, y, p.r * 2.4);
      gr.addColorStop(0, 'rgba(255,236,196,' + (p.a * tw * e) + ')');
      gr.addColorStop(0.35, 'rgba(233,196,138,' + (p.a * tw * e * 0.55) + ')');
      gr.addColorStop(1, 'rgba(199,164,106,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, p.r * 2.4, 0, 6.283); g.fill();
    });
  };
  window.cena(0);
})();
</script>
</body>
</html>
